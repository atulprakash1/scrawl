<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrawl</title>
  <link rel="stylesheet" href="app/css/scrawl.css">
</head>
<body>
  <!-- Welcome / folder picker -->
  <main id="welcome" class="welcome" hidden>
    <div class="welcome-card">
      <h1 class="logo">Scrawl<span class="logo-dot">.</span></h1>
      <p class="tagline">a sketchbook project board for you &amp; Claude</p>
      <p id="welcome-msg"></p>
      <div id="welcome-actions" class="welcome-actions"></div>
    </div>
  </main>

  <!-- Project wizard: shown when project.md is still empty -->
  <main id="wizard" class="welcome" hidden>
    <div id="wizard-card" class="welcome-card wizard-card"></div>
  </main>

  <!-- The board -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-main">
        <div class="brand">
          <h1 class="logo logo-small">Scrawl<span class="logo-dot">.</span></h1>
          <span class="crumb-sep" aria-hidden="true">/</span>
          <span id="project-name" class="project-name"></span>
        </div>
        <nav class="views" aria-label="View">
          <button class="view-btn" data-view="board" aria-pressed="true">Board</button>
          <button class="view-btn" data-view="plan" aria-pressed="false">Plan</button>
          <button class="view-btn" data-view="bugs" aria-pressed="false">Bug jar</button>
          <button class="view-btn" data-view="today" aria-pressed="false">Today</button>
          <button class="view-btn" data-view="timeline" aria-pressed="false">Timeline</button>
          <button class="view-btn" data-view="releases" aria-pressed="false">Releases</button>
        </nav>
        <div class="top-actions">
          <button id="palette-btn" class="btn palette-trigger" title="Command palette (Ctrl+K)">⌕ <span class="btn-label">Search</span> <kbd>Ctrl K</kbd></button>
          <button id="hookup-btn" class="btn btn-claude" title="Write the Claude Code protocol, commands and hooks into this repo">🤖 <span class="btn-label">Hook up Claude</span></button>
          <button id="switch-folder" class="icon-btn" title="Projects: recent folders, or pick another" aria-label="Projects">📂</button>
          <button id="theme-toggle" class="icon-btn" title="Light / dark" aria-label="Toggle theme">◐</button>
        </div>
      </div>
      <!-- Only on the Board: these act on its cards -->
      <div id="board-tools" class="board-tools">
        <form id="quick-add" class="quick-add" autocomplete="off">
          <input name="title" placeholder="Add… e.g. bug: crash on empty form" aria-label="Quick add item">
          <button class="btn" type="submit">+ Add</button>
        </form>
        <input id="filter-text" class="filter" type="search" placeholder="Filter" aria-label="Filter cards">
        <select id="filter-who" class="filter" aria-label="Filter by assignee">
          <option value="">Everyone</option>
          <option value="me">☕ Me</option>
          <option value="claude">🤖 Claude</option>
        </select>
      </div>
    </header>

    <div id="readonly-banner" class="banner banner-info" hidden></div>
    <div id="offline" class="banner" hidden>
      Lost access to the folder.
      <button id="regrant" class="btn">Let Scrawl back in</button>
    </div>

    <main id="board" class="board" aria-describedby="board-keys"></main>
    <p id="board-keys" class="sr-only">Cards: Enter opens one, Space picks it up, arrow keys move it, Space drops it, Escape cancels.</p>
    <p id="board-live" class="sr-only" aria-live="assertive"></p>
    <p id="hidden-note" class="hidden-note muted"></p>
    <main id="plan" class="plan" hidden></main>
    <main id="bugs" class="view" hidden></main>
    <main id="today" class="view" hidden></main>
    <main id="timeline" class="view" hidden></main>
    <main id="releases" class="view releases" hidden></main>
  </div>

  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Item details"></aside>
  <dialog id="hookup" class="dialog" aria-label="Hook up Claude"></dialog>
  <dialog id="palette" class="dialog palette-dialog" aria-label="Command palette"></dialog>
  <dialog id="projects" class="dialog" aria-label="Projects"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Classic scripts on purpose: Chrome blocks type="module" on file:// pages. -->
  <script src="vendor/sortable.min.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app/js/util.js"></script>
  <script src="app/js/parser.js"></script>
  <script src="app/js/rank.js"></script>
  <script src="app/js/fs.js"></script>
  <script src="app/js/readonly.js"></script>
  <script src="app/js/store.js"></script>
  <script src="app/js/watcher.js"></script>
  <script src="app/js/board.js"></script>
  <script src="app/js/plan.js"></script>
  <script src="app/js/releases.js"></script>
  <script src="app/js/timeline.js"></script>
  <script src="app/js/bugs.js"></script>
  <script src="app/js/today.js"></script>
  <script src="app/js/attachments.js"></script>
  <script src="app/js/drawer.js"></script>
  <script src="app/js/wizard.js"></script>
  <script src="app/js/templates.js"></script>
  <script src="app/js/hookup.js"></script>
  <script src="app/js/palette.js"></script>
  <script src="app/js/main.js"></script>
</body>
</html>
